name: Signaler les pages à IndexNow

on:
  push:
    branches: [main]
    paths: ['*.html', 'sitemap.xml', '*.txt']

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attendre la mise en ligne Netlify
        run: sleep 120
      - name: Envoyer à IndexNow
        run: python3 .github/scripts/indexnow.py ${{ github.event.before }}
      - name: Resoumettre le sitemap à Google Search Console
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
        run: |
          pip install -q google-auth requests
          python3 .github/scripts/gsc_sitemap.py

name: Publier les articles Etrah

# Vérifie chaque jour s'il y a un article prévu dans queue.json (1 par semaine, le mardi).
# Lancement manuel possible depuis l'onglet Actions, avec un mode "test" qui génère un article
# complet sans rien publier (pour vérifier la clé API, le modèle et la qualité SEO).
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: "Mode test : générer un article de vérification sans rien publier"
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install anthropic

      - name: Test de génération (rien n'est publié)
        if: inputs.test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TITLE=$(python3 -c "import json;q=json.load(open('queue.json'));print(next(a['title'] for a in q if a.get('status')=='pending'))")
          python generer.py --dry-run --out=test-output "$TITLE"

      - name: Vérifier les images de couverture et les pages du site
        if: inputs.test
        run: |
          python3 - <<'EOF'
          import re, sys, urllib.request, urllib.error
          sys.path.insert(0, ".")
          from generer import HERO_IMAGES
          pages = sorted(set(re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml").read())))
          bad = []
          for u in HERO_IMAGES + pages:
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=20)
                  code = r.status
              except urllib.error.HTTPError as e:
                  code = e.code
              print(code, u)
              if code >= 400: bad.append(u)
          sys.exit(f"{len(bad)} URL en erreur : {bad}" if bad else 0)
          EOF

      - name: Joindre l'article de test (téléchargeable depuis l'exécution)
        if: inputs.test && always()
        uses: actions/upload-artifact@v4
        with:
          name: article-de-test
          path: test-output/
          if-no-files-found: ignore
          retention-days: 7

      - name: Copier l'article de test sur la branche test-output (hors site)
        if: inputs.test
        run: |
          git config user.name "Etrah Studio"
          git config user.email "studio@site-mariage.com"
          mkdir -p /tmp/out && cp -r test-output /tmp/out/
          git checkout -q --orphan test-output
          git rm -rq --cached . && git clean -fdxq
          cp -r /tmp/out/test-output . && git add test-output
          git commit -qm "Article de test (non publié)"
          git push -qf origin test-output

      - name: Publier l'article de la semaine
        id: pub
        if: ${{ !inputs.test }}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python .github/scripts/publish.py

      - name: Commit et push
        if: ${{ !inputs.test }}
        env:
          MSG: ${{ steps.pub.outputs.message }}
        run: |
          git config user.name "Etrah Studio"
          git config user.email "studio@site-mariage.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Rien à enregistrer."
          else
            git commit -m "✦ ${MSG:-Mise à jour automatique} — $(date +'%Y-%m-%d')"
            git pull --rebase -q origin main
            git push
          fi

      - name: Signaler les nouvelles pages à IndexNow (Bing…)
        if: steps.pub.outputs.published == '1'
        run: |
          sleep 120
          python3 .github/scripts/indexnow.py HEAD~1

      - name: Resoumettre le sitemap à Google Search Console
        if: steps.pub.outputs.published == '1'
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
        run: |
          pip install -q google-auth requests
          python3 .github/scripts/gsc_sitemap.py

      - name: Signaler l'échec de génération
        if: steps.pub.outcome == 'failure'
        run: |
          echo "::error::La génération de l'article a échoué. Voir l'étape « Publier l'article de la semaine »."
          exit 1
